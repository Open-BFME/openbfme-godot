; Lane LAUNCH-1: the launcher packages (tools/release/build_launcher.sh exports these from a clean `git archive` of launcher/ with the
; generated build_info.json; release_key.pub is not exported: the key is compiled into build_info.json). Godot's RELEASE template (the
; launcher needs no native backtraces; its log is user://launcher.log). The pack is EMBEDDED in the executable (embed_pck=true): the
; launcher is one file, so a self-update replaces it with one atomic rename (Sol r1; scripts/core/self_update.gd); the pack is
; unencrypted, so tools/release/audit_package.py still reads every entry; scripts are exported as text (script_export_mode=0). The tests
; are not exported.

