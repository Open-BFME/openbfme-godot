; Lane OWNERFIX-3: the Windows executable carries the OpenBFME icon (assets/app_icon/openbfme.ico, generated by tools/release/app_icon.py;
; application/modify_resources, checked by app_icon.py --check-exe in build_launcher.sh); the window icon at run time is scripts/ui/app_icon.gd.
; Lane LAUNCH-1: the launcher packages (tools/release/build_launcher.sh exports these from a clean `git archive` of launcher/ with the
; generated build_info.json; release_key.pub, release_keys.pub and nightly_keys.pub are not exported: the keys are compiled into build_info.json). Godot's RELEASE template (the
; launcher needs no native backtraces; its log is user://launcher.log). The pack is EMBEDDED in the executable (embed_pck=true): the
; launcher is one file, so a self-update replaces it with one atomic rename (Sol r1; scripts/core/self_update.gd); the pack is
; unencrypted, so tools/release/audit_package.py still reads every entry; scripts are exported as text (script_export_mode=0). The tests
; are not exported.
; Lane REPRO-1: include_filter and exclude_filter stay EMPTY. Godot applies them in the file system's raw directory order, which differs
; between hosts and decides the order of the files in the pack; the editor plugin addons/pack_files (export_plugin.gd) skips the tests and
; itself and release_key.pub / release_keys.pub / nightly_keys.pub (CryptoKey resources) and adds build_info.json and fonts/OFL-*.txt in sorted order instead.

