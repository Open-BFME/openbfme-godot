# OpenBFME CI — the gate that stands between this repository and the public.
#
# Job ordering is deliberate. `publication-boundary` runs first and the build
# jobs need it: if a retail-derived byte or a developer-machine path is present
# there is no point building anything, and no artifact should be produced.
#
# Public-safe by design: no job touches retail content. The engine suite runs on
# BOTH Windows and Linux — the pinned-hash test proves the fixed-point kernel is
# bit-identical across platforms (the 8-player lockstep guarantee).
#
# Pack-gated Godot runners (retail_slice_runner etc.) need the private content
# root and belong on self-hosted runners: give those jobs
#   runs-on: [self-hosted, openbfme-private]
# and they will only ever run on the owner's hardware.
#
# Actions are pinned by commit SHA, not tag, so a compromised or retagged action
# cannot silently change what runs here.

name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# Least privilege by default; no job here needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-boundary:
    name: publication boundary (release firewall)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Prove the scanner itself still detects what it claims to detect before
      # trusting its verdict. A scanner that silently stopped working would
      # otherwise report a clean pass forever.
      - name: Self-test the export scanner
        shell: powershell
        run: ./tools/test-export-scan.ps1

      # Phase 1 scans the exported game tree; phase 2 scans every tracked file
      # in the repository for retail formats, private paths, home directories
      # and credential-shaped strings. Both must pass.
      - name: Scan for retail bytes and developer-machine specifics
        shell: powershell
        run: ./tools/export-scan.ps1

  launcher-mcp:
    name: launcher MCP surface
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/bfme-launcher-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/bfme-launcher-mcp/package-lock.json

      # `npm ci` (not `npm install`) so the committed lockfile is authoritative
      # and its integrity hashes are enforced.
      - run: npm.cmd ci

      # Known-vulnerable transitive dependencies fail the build. Fixes are
      # applied via the `overrides` block in package.json.
      - name: Audit dependencies
        run: npm.cmd audit --audit-level=moderate

      # Every suite, not just the dependency-free one. core.test.mjs covers the
      # launcher identity pin, path resolution and the elevation flow.
      - name: Test launcher core, protocol, and raw protocol
        run: node --test test/core.test.mjs test/protocol.test.mjs test/raw-protocol.test.mjs

  importer:
    name: importer suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      # --require-hashes: every dependency must match a pinned digest, so a
      # compromised or yanked-and-replaced PyPI artifact fails closed.
      - name: Install hash-pinned importer dependencies
        run: python -m pip install --require-hashes --only-binary=":all:" -r importer/requirements-win.txt

      # Oracle tests that need a retail install skip themselves when
      # BFME2_INSTALL is unset, which is always the case on a public runner.
      - name: Run importer tests
        env:
          PYTHONPATH: importer
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: python -m pytest importer/tests -q

  engine:
    name: engine determinism (${{ matrix.os }})
    needs: publication-boundary
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Run OpenBfme.Sim test suite
        # The dual-run oracle compares the C# sim against a GDScript trace that
        # lives under /.private/ and is therefore absent here by design. It used
        # to return early and report Passed, so this job has been claiming a
        # cross-language guarantee it never checked. The test now fails closed;
        # this variable is the explicit, auditable declaration that public CI
        # cannot verify that oracle. Remove it on a runner that has the trace.
        env:
          OPENBFME_DUALRUN_OPTIONAL: "1"
        run: dotnet test engine/OpenBfme.Engine.sln --nologo --configuration Release

  launcher:
    name: launcher security suite
    needs: publication-boundary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.0.0
        with:
          dotnet-version: "8.0.x"

      # These tests guard the code that decides what lands on a player's disk:
      # signed-manifest verification against a pinned key, hash and size checks
      # before extraction, archive traversal and symlink rejection, atomic
      # selection, repair and rollback. Until now they ran only in release.yml,
      # so every push and pull request went unchecked on exactly the surface
      # where a defect is a security defect.
      #
      # `dotnet run`, NOT `dotnet test`: the test project is a plain console app
      # with no test adapter, so `dotnet test` executes ZERO tests and still
      # exits 0 - a green tick for nothing. Same invocation as release.yml:132.
      - name: Run launcher installer and updater tests
        run: dotnet run --project launcher/OpenBFME.Launcher.Tests/OpenBFME.Launcher.Tests.csproj --configuration Release

      # Release tooling negative cases: manifest validation, version rules,
      # and the packaging path.
      - name: Test release tooling
        shell: powershell
        run: ./tools/release/Test-ReleaseTools.ps1

  godot-exports:
    name: godot export (windows + linux)
    runs-on: ubuntu-latest
    needs: [publication-boundary, engine]
    env:
      GODOT_VERSION: "4.7"
      GODOT_RELEASE: "4.7-stable"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Godot + export templates
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}

      # Integrity: Godot publishes SHA512-SUMS.txt alongside each release and we
      # verify both downloads against it. This catches truncated, corrupted and
      # CDN-substituted artifacts.
      #
      # LIMITATION, read before trusting this: the sums file comes from the same
      # release as the binaries, so it does NOT protect against a compromised
      # upstream release. Pinning the two digests as literals here (as the
      # release branch's release.yml does) is strictly stronger and should be
      # done once the owner has verified them out-of-band.
      - name: Download and verify Godot headless + export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot
          cd ~/godot
          curl -fsSL --retry 5 --retry-all-errors --retry-max-time 120 \
            -o SHA512-SUMS.txt "${base}/SHA512-SUMS.txt"
          curl -fsSL --retry 5 --retry-all-errors --retry-max-time 120 \
            -o "Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            "${base}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL --retry 5 --retry-all-errors --retry-max-time 120 \
            -o "Godot_v${GODOT_RELEASE}_export_templates.tpz" \
            "${base}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          # Keep only the lines for the two files we actually fetched, then
          # verify. `-c` fails the step on any mismatch; the `test -s` guard
          # stops an upstream rename from turning this into a silent no-op.
          grep -E "(Godot_v${GODOT_RELEASE}_linux\.x86_64\.zip|Godot_v${GODOT_RELEASE}_export_templates\.tpz)$" \
            SHA512-SUMS.txt > expected-sums.txt
          test -s expected-sums.txt
          sha512sum -c expected-sums.txt
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -d ~/godot
          mkdir -p ~/.local/share/godot/export_templates ~/godot/templates-extract
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz" -d ~/godot/templates-extract
          mv ~/godot/templates-extract/templates \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      # NOTE: this step previously ended in `|| true`, which meant a broken
      # project "imported successfully" and the real failure only surfaced later
      # as a confusing export error. Import failures now fail the build.
      - name: Import project (first headless run builds .godot cache)
        run: ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 --headless --path game --import

      - name: Export Windows build
        run: |
          set -euo pipefail
          mkdir -p dist/windows
          ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 --headless --path game \
            --export-release "windows" "$(pwd)/dist/windows/OpenBFME.exe"

      - name: Export Linux build
        run: |
          set -euo pipefail
          mkdir -p dist/linux
          ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 --headless --path game \
            --export-release "linux" "$(pwd)/dist/linux/OpenBFME.x86_64"

      - name: Verify artifacts exist and are non-trivial
        run: |
          set -euo pipefail
          test -s dist/windows/OpenBFME.exe
          test -s dist/linux/OpenBFME.x86_64
          ls -la dist/windows dist/linux

      # Record what was actually produced so a release can be traced back to it.
      - name: Record artifact digests
        run: |
          set -euo pipefail
          sha256sum dist/windows/OpenBFME.exe dist/linux/OpenBFME.x86_64 \
            | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openbfme-windows
          path: |
            dist/windows/
            dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openbfme-linux
          path: |
            dist/linux/
            dist/SHA256SUMS.txt

  # The GDScript simulation is the one that actually runs the game, and it has
  # no cross-platform determinism proof. Every existing assertion compares two
  # sims inside ONE process, which cannot detect a platform-dependent result.
  # The C# engine has CrossPlatformPinTests; the shipping simulation has had
  # nothing. This job runs a frozen 3000-tick scenario on Windows and Ubuntu
  # and fails if the authoritative state hashes differ.
  #
  # COVERAGE GAP, read before trusting a green result: the pin scenario injects
  # no route_provider, so routing takes the bounded direct fallback and Godot's
  # AStarGrid2D is never exercised. AStarGrid2D uses float32 costs and engine-
  # internal tie-breaking with no cross-platform stability guarantee, and is the
  # most likely divergence source. Green here proves the simulation's own float
  # math, ordering and trigonometry agree. It proves nothing about pathing.
  sim-state-pin:
    name: sim state pin (${{ matrix.os }})
    needs: publication-boundary
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: Godot_v4.7-stable_linux.x86_64.zip
            bin: Godot_v4.7-stable_linux.x86_64
          - os: windows-latest
            asset: Godot_v4.7-stable_win64.exe.zip
            bin: Godot_v4.7-stable_win64_console.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GODOT_RELEASE: "4.7-stable"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and verify Godot headless
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          mkdir -p "$HOME/godot" && cd "$HOME/godot"
          curl -fsSL --retry 5 --retry-all-errors --retry-max-time 120 \
            -o SHA512-SUMS.txt "${base}/SHA512-SUMS.txt"
          curl -fsSL --retry 5 --retry-all-errors --retry-max-time 120 \
            -o "${{ matrix.asset }}" "${base}/${{ matrix.asset }}"
          # `test -s` stops an upstream rename turning verification into a no-op.
          grep -E "${{ matrix.asset }}$" SHA512-SUMS.txt > expected-sums.txt
          test -s expected-sums.txt
          sha512sum -c expected-sums.txt
          # Python rather than unzip: unzip is not guaranteed on the Windows
          # runner image, and a missing tool here would fail late and obscurely.
          python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('.')" "${{ matrix.asset }}"
          chmod +x "${{ matrix.bin }}" || true
          test -f "${{ matrix.bin }}"
      - name: Emit authoritative state pin
        run: |
          set -euo pipefail
          "$HOME/godot/${{ matrix.bin }}" --headless --path game \
            -s res://tests/retail_state_pin_runner.gd | tee pin-output.txt
          grep -oE 'hash=[0-9a-f]{64}' pin-output.txt | cut -d= -f2 > pin-hash.txt
          test -s pin-hash.txt
          echo "pin: $(cat pin-hash.txt)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sim-state-pin-${{ matrix.os }}
          path: pin-hash.txt

  sim-state-pin-compare:
    name: sim state pin agrees across platforms
    needs: sim-state-pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: pins
      - name: Compare Windows and Linux authoritative state
        run: |
          set -euo pipefail
          win=$(cat pins/sim-state-pin-windows-latest/pin-hash.txt)
          lin=$(cat pins/sim-state-pin-ubuntu-latest/pin-hash.txt)
          echo "windows: $win"
          echo "linux:   $lin"
          if [ "$win" != "$lin" ]; then
            echo "::error::Authoritative simulation state diverges across platforms."
            echo "The GDScript simulation is not deterministic across OSes, so"
            echo "cross-platform lockstep multiplayer cannot work as built."
            echo "Bisect with retail_state_pin_runner.gd by lowering PIN_TICKS."
            exit 1
          fi
          echo "Authoritative state is bit-identical on Windows and Linux."
