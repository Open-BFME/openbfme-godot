; Lane RELEASE-1: the test packages (tools/release/package.sh exports these from a clean `git archive` of godot/).
; The GDExtension library of each platform is copied next to the executable from openbfme.gdextension; the pack stays a separate,
; unencrypted file so tools/release/audit_package.py can read every entry; scripts are exported as text (script_export_mode=0: the binary
; token form is a zstd stream, a container inside the pack, which the release allowlist refuses). The tests are exported too (GDScript only) so the packaged
; build can run its own smoke / start tests.
; "macOS arm64" (lane MAC-1, packaged by package.sh --platforms macos on a Mac): the extension it carries (Contents/Frameworks) is the
; arm64 build, so the app runs on Apple Silicon only. Godot ships one universal macOS template; package.sh exports the staged copy of this
; preset with binary_format/architecture="arm64" and custom_template/debug set to the arm64 archive tools/release/macos_template.py makes,
; so the bundle's executable is arm64 only too (an editor export of the committed preset stays universal and warns that no x86_64
; library exists). codesign/codesign=0: Godot's built-in ad-hoc signer gives the extension a random identifier, so two exports never
; match; package.sh signs the extension and the bundle ad hoc with codesign instead (fixed identifiers, the hardened runtime, the
; disable-library-validation entitlement of tools/release/macos_entitlements.plist, which macOS needs before it loads the extension);
; nothing is notarized (docs/STOPS.md S-3710). The pack sits in Contents/Resources, so --headless -- --auto --check works on the bundle's
; executable as on the other platforms.

